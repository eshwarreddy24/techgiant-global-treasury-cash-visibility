<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">TechGiant treasury project logo</title>
  <desc id="desc">A navy and cyan isometric cube beside the TechGiant wordmark.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#shadow)" transform="translate(22 18)">
    <path d="M70 8 136 45 70 82 4 45Z" fill="url(#top)"/>
    <path d="M4 45v72l66 38V82Z" fill="url(#left)"/>
    <path d="M136 45v72l-66 38V82Z" fill="url(#right)"/>
    <path d="m70 28 28 16-28 16-28-16Z" fill="#e0f2fe" opacity=".8"/>
  </g>
  <text x="190" y="82" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0f172a" letter-spacing="2">TECHGIANT</text>
  <text x="193" y="122" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#0e7490" letter-spacing="4">TREASURY TRANSFORMATION</text>
</svg>
