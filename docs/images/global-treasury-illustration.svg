<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Global treasury network illustration</title>
  <desc id="desc">Four regional bank nodes feed a central cash and reconciliation platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="960" height="420" rx="28" fill="url(#bg)"/>
  <g stroke="#67e8f9" stroke-width="3" stroke-dasharray="8 8" opacity=".65" fill="none">
    <path d="M195 98 390 205M765 98 570 205M195 322 390 235M765 322 570 235"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(90 56)">
      <path d="M0 26 70 0l70 26-70 26Z" fill="#67e8f9"/><path d="M0 26v72l70 28V52Z" fill="#0e7490"/><path d="M140 26v72l-70 28V52Z" fill="#2563eb"/>
      <text x="70" y="155" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="17" font-weight="700">NORTH AMERICA</text>
    </g>
    <g transform="translate(690 56)">
      <path d="M0 26 70 0l70 26-70 26Z" fill="#facc15"/><path d="M0 26v72l70 28V52Z" fill="#b45309"/><path d="M140 26v72l-70 28V52Z" fill="#ca8a04"/>
      <text x="70" y="155" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="17" font-weight="700">EUROPE</text>
    </g>
    <g transform="translate(90 280)">
      <path d="M0 26 70 0l70 26-70 26Z" fill="#5eead4"/><path d="M0 26v72l70 28V52Z" fill="#0f766e"/><path d="M140 26v72l-70 28V52Z" fill="#115e59"/>
      <text x="70" y="155" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="17" font-weight="700">INDIA</text>
    </g>
    <g transform="translate(690 280)">
      <path d="M0 26 70 0l70 26-70 26Z" fill="#93c5fd"/><path d="M0 26v72l70 28V52Z" fill="#1d4ed8"/><path d="M140 26v72l-70 28V52Z" fill="#1e3a8a"/>
      <text x="70" y="155" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="17" font-weight="700">UK</text>
    </g>
    <g transform="translate(352 150)">
      <rect width="256" height="120" rx="18" fill="url(#card)" stroke="#a5f3fc" stroke-width="2"/>
      <text x="128" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">TREASURY HUB</text>
      <text x="128" y="72" text-anchor="middle" fill="#cffafe" font-family="Arial" font-size="15">Cash visibility</text>
      <text x="128" y="94" text-anchor="middle" fill="#cffafe" font-family="Arial" font-size="15">Bank-to-GL controls</text>
    </g>
  </g>
</svg>
