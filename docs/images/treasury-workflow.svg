<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Treasury workflow architecture</title>
  <desc id="desc">Bank and GL inputs flow through validation, reconciliation, cash visibility, forecast, and exception reporting.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2142"/><stop offset="1" stop-color="#123b61"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1280" height="430" rx="24" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g filter="url(#s)">
      <rect x="50" y="75" width="190" height="110" rx="18" fill="url(#panel)"/>
      <rect x="50" y="245" width="190" height="110" rx="18" fill="url(#panel)"/>
      <rect x="360" y="145" width="205" height="150" rx="18" fill="url(#panel)"/>
      <rect x="680" y="145" width="205" height="150" rx="18" fill="url(#panel)"/>
      <rect x="1000" y="55" width="210" height="100" rx="18" fill="url(#panel)"/>
      <rect x="1000" y="220" width="210" height="100" rx="18" fill="url(#panel)"/>
    </g>
    <g fill="#e0f2fe" font-size="20" font-weight="700">
      <text x="145" y="123">Bank feeds</text><text x="145" y="293">ERP / GL</text>
      <text x="462" y="205">Validate &amp;</text><text x="462" y="232">normalize</text>
      <text x="782" y="205">Reconcile</text><text x="782" y="232">&amp; classify</text>
      <text x="1105" y="96">Cash position</text><text x="1105" y="261">Forecast &amp;</text><text x="1105" y="288">exceptions</text>
    </g>
    <g fill="#67e8f9" font-size="14">
      <text x="145" y="150">20 synthetic rows</text><text x="145" y="320">21 synthetic rows</text>
      <text x="462" y="262">keys • dates • FX</text><text x="782" y="262">match • variance</text>
      <text x="1105" y="123">USD • reserves</text><text x="1105" y="310">4 scenario weeks</text>
    </g>
    <g fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)">
      <path d="M240 130h110"/><path d="M240 300h110"/><path d="M565 220h105"/><path d="M885 190h105"/><path d="M885 250h105"/>
    </g>
    <text x="640" y="38" fill="#0b2142" font-size="22" font-weight="700">TechGiant treasury control architecture</text>
  </g>
</svg>
